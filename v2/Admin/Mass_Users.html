<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Mass Import Users</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- Firebase 8.x -->
	<script src="https://www.gstatic.com/firebasejs/8.0.1/firebase-app.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.0.1/firebase-auth.js"></script>
	<script src="https://www.gstatic.com/firebasejs/8.0.1/firebase-firestore.js"></script>
	<!-- PapaParse for CSV -->
	<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f5f5f5;
			margin: 0;
			padding: 0;
		}

		.header {
			background: #1c4a72;
			color: #fff;
			padding: 1rem;
			text-align: center;
		}

		.container {
			max-width: 600px;
			margin: 2rem auto;
			background: #fff;
			padding: 1.5rem;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
			border-radius: 4px;
		}

		.btn {
			display: inline-block;
			padding: .6rem 1.2rem;
			font-size: 1rem;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			text-decoration: none;
			text-align: center;
		}

		.btn-primary {
			background: #1c4a72;
			color: #fff;
		}

		.btn:disabled {
			opacity: .6;
			cursor: not-allowed;
		}

		input[type="file"] {
			margin-bottom: 1rem;
		}

		.progress {
			width: 100%;
			background: #eee;
			border-radius: 4px;
			overflow: hidden;
			margin-top: 1rem;
			height: 1.5rem;
			display: none;
		}

		.progress-bar {
			height: 100%;
			width: 0;
			background: #1c4a72;
			color: #fff;
			text-align: center;
			line-height: 1.5rem;
			font-size: .9rem;
			transition: width .2s;
		}

		.modal-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, .5);
			display: none;
			align-items: center;
			justify-content: center;
		}

		.modal {
			background: #fff;
			padding: 1.5rem;
			border-radius: 4px;
			max-width: 500px;
			width: 90%;
			box-shadow: 0 2px 10px rgba(0, 0, 0, .2);
		}

		.modal h2 {
			margin-top: 0;
			color: #1c4a72;
		}

		.modal .close-btn {
			background: #1c4a72;
			color: #fff;
			float: right;
			border: none;
			padding: .3rem .6rem;
			cursor: pointer;
			border-radius: 3px;
		}

		.modal pre {
			background: #f0f0f0;
			padding: .8rem;
			overflow-x: auto;
		}
	</style>
</head>

<body>

	<div class="header">
		<h1>📥 Mass Import Users</h1>
	</div>

	<div class="container">
		<p>Select a CSV where:</p>
		<ul>
			<li><strong>col 1:</strong> userID</li>
			<li><strong>col 2:</strong> Email</li>
			<li><strong>col 3+:</strong> classes…</li>
		</ul>

		<input type="file" id="csvFile" accept=".csv" />
		<br>
		<button id="importBtn" class="btn btn-primary" disabled>Import Now</button>

		<div class="progress" id="progressWrapper">
			<div class="progress-bar" id="progressBar">0%</div>
		</div>
	</div>

	<!-- Modal Overlay -->
	<div class="modal-overlay" id="modalOverlay">
		<div class="modal">
			<button class="close-btn" id="modalClose">&times;</button>
			<div id="modalContent"></div>
		</div>
	</div>

	<script>
		// --- Firebase init ---
    const firebaseConfig = {
      apiKey: "AIzaSyAFreRZQyNL1TgLRFqahV7frEOTbWwK2no",
      authDomain: "yancal.firebaseapp.com",
      projectId: "yancal",
      storageBucket: "yancal.firebasestorage.app",
      messagingSenderId: "43607057377",
      appId: "1:43607057377:web:c213aebf1ab4d6d61928a0",
      measurementId: "G-BDL86XTVJX"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    // --- UI elements ---
    const fileInput    = document.getElementById('csvFile');
    const importBtn    = document.getElementById('importBtn');
    const progressBar  = document.getElementById('progressBar');
    const progressWrp  = document.getElementById('progressWrapper');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');
    const modalClose   = document.getElementById('modalClose');

    let csvData = null;
    fileInput.addEventListener('change', e => {
      if (e.target.files.length) {
        importBtn.disabled = false;
        csvData = e.target.files[0];
      }
    });

    importBtn.addEventListener('click', () => {
      if (!csvData) return;
      importBtn.disabled = true;
      progressWrp.style.display = 'block';
      progressBar.style.width = '0%';
      progressBar.textContent = '0%';

      // 1) Sign in
      auth.signInWithEmailAndPassword('nrayan678@Gmail.com', 'bluejay360')
        .then(() => {
          // 2) Parse CSV
          Papa.parse(csvData, {
            header: true,
            skipEmptyLines: true,
            complete: results => {
              const rows = results.data;
              let done = 0, success = 0;
              const failures = [];

              rows.forEach(row => {
                const userID = row.userID.trim();
                const email  = row.email.trim();

                // build a map of { headerName: cellValue, … }
                const classes = Object.entries(row)
                  .filter(([key, val]) => {
                    const k = key.trim().toLowerCase();
                    return k !== 'userid' && k !== 'email' && val.trim() !== '';
                  })
                  .reduce((map, [key, val]) => {
                    map[key.trim()] = val.trim();
                    return map;
                  }, {});

                const docId = `${email}_${userID}`;
                const data  = {
                  userID,
                  email,
                  orgName: 'mhs2',
                  classes
                };

                db.collection('Users').doc(docId).set(data)
                  .then(() => { success++; })
                  .catch(err => { failures.push({ docId, error: err.message }); })
                  .finally(() => {
                    done++;
                    const pct = Math.round((done / rows.length) * 100);
                    progressBar.style.width = pct + '%';
                    progressBar.textContent = pct + '%';
                    if (done === rows.length) {
                      showResultModal(success, rows.length, failures);
                    }
                  });
              });

            },
            error: err => {
              showModal('CSV Parse Error', `<p>${err.message}</p>`);
            }
          });
        })
        .catch(err => {
          showModal('Sign‑In Failed', `<p>${err.message}</p>`);
        });
    });

    // --- Modal functions ---
    function showModal(title, htmlContent) {
      modalContent.innerHTML = `<h2>${title}</h2>${htmlContent}`;
      modalOverlay.style.display = 'flex';
    }
    function showResultModal(success, total, failures) {
      let html = `<h2>Import Complete</h2>
                  <p><strong>${success}/${total}</strong> imported successfully.</p>`;
      if (failures.length) {
        html += `<p>${failures.length} failed:</p>
                 <pre>${failures.map(f => f.docId + ': ' + f.error).join('\n')}</pre>`;
      }
      showModal('Results', html);
    }
    modalClose.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
      importBtn.disabled = false;
    });
	</script>
</body>

</html>
