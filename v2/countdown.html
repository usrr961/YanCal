        function updateCountdowns() {
            const now = new Date();
            const container = document.getElementById("events");
            const currentDateDiv = document.getElementById("current-date");
            currentDateDiv.textContent = `Today's Date: ${now.toLocaleString()}`;
            container.innerHTML = "";
            let closestEvent = null;
            let closestTime = Infinity;

            events.forEach(event => {
                const eventDate = new Date(event.date);
                const timeDiff = eventDate - now;
                if (timeDiff > 0 && timeDiff < closestTime) {
                    closestEvent = event;
                    closestTime = timeDiff;
                }
                const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);
                const isPast = timeDiff <= 0;
                const eventDiv = document.createElement("div");
                eventDiv.className = `event${isPast ? " past" : ""}`;
                eventDiv.innerHTML = `
                    <strong>${event.name}</strong><br>
			          		<span class="event-date">${eventDate.toLocaleString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span><br>
                    <span class="countdown">${isPast ? "Event has passed." : `${days}d ${hours}h ${minutes}m ${seconds}s`}</span>
                `;
                container.appendChild(eventDiv);
                eventDiv.addEventListener("click", () => handleEventClick(event));
            });

            if (closestEvent) {
                const closestElement = Array.from(container.children).find(div =>
                    div.textContent.includes(closestEvent.name)
                );
                if (closestElement) {
                    closestElement.style.border = "2px solid #ff8400";
                    /*closestElement.style.border = "2px solid #e3b58d";*/
                    
                    
                    closestElement.style.backgroundColor = "#fff7eb";
                }
            }
        }
        
        function generateICSFile(event) {
          const startDate = new Date(event.date).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
          /*const endDate = new Date(new Date(event.date).getTime() + 2 * 60 * 60 * 1000).toISOString().replace(/[-:]/g,
          '').split('.')[0] + 'Z';*/
          const endDate = new Date(new Date(event.date).setDate(new Date(event.date).getDate() + 1))
              .toISOString().split('T')[0].replace(/-/g, '');
          const icsContent =
          `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${event.name}\nDTSTART:${startDate}\nDTEND:${endDate}\nDESCRIPTION:FRC Event Team 555 \nEND:VEVENT\nEND:VCALENDAR`;
          const blob = new Blob([icsContent], { type: 'text/calendar' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${event.name.replace(/\s+/g, '_')}.ics`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
        
        function handleEventClick(event) {
			const eventDate = new Date(event.date);
			const startISO = eventDate.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
			const endISO = new Date(eventDate.getTime() + 2 * 60 * 60 * 1000).toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
			generateICSFile(event);
			if (navigator.userAgent.includes("Android")) {
				window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(event.name)}&dates=${startISO}/${endISO}`, '_blank').focus();
			}
        }
