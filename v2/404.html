<!DOCTYPE html>
<html lang="en">

<head>
    <meta charSet="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
</head>

<body class="">
    <div
        style="font-family:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji';height:100vh;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div>
            <style>
                body {
                    color: #000;
                    background: #fff;
                    margin: 0;
                    font-size:1.2em;
                    overflow-y:hidden;
                }

                .next-error-h1 {
                    border-right: 1px solid rgba(0, 0, 0, .3)
                }

                @media (prefers-color-scheme:dark) {
                    body {
                        color: #fff;
                        background: #000
                    }

                    .next-error-h1 {
                        border-right: 1px solid rgba(255, 255, 255, .3)
                    }
                }
            </style>
            <h1 class="next-error-h1"
                style="display:inline-block;margin:0 20px 0 0;padding:0 23px 0 0;font-size:24px;font-weight:500;vertical-align:top;line-height:49px">
                404</h1>
            <div style="display:inline-block">
                <h2 style="font-size:1.2em;font-weight:400;line-height:49px;margin:0">This page could not be found.</h2>
                

            </div>
            <p id="status"></p>

    <a id="back-link" href="/" style="display:block;color: #58a6ff;margin-right:1.2em;margin-top:1rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
            <path fill="#007067"
                d="M11.9998836,4.09370803 L8.55809517,7.43294953 C8.23531459,7.74611298 8.23531459,8.25388736 8.55809517,8.56693769 L12,11.9062921 L9.84187871,14 L4.24208544,8.56693751 C3.91930485,8.25388719 3.91930485,7.74611281 4.24208544,7.43294936 L9.84199531,2 L11.9998836,4.09370803 Z">
            </path>
        </svg>
        Back
    </a>
    <script>
        (function() {
            if (document.referrer && document.location.host && document.referrer.match(new RegExp("^https?://" +
            document.location.host))) {
            document.getElementById("back-link").setAttribute("href", document.referrer);
          }
          })();
          let path = window.location.pathname;
            if (/\.html/gi.test(path)) {
                path = path.replace(/\.html/gi, '.zz');
                //window.history.replaceState(null, '', path);
            }
        document.getElementById('status').innerText=`Your location: ${ path + window.location.search + window.location.hash}`
    </script>
        </div>

    </div>
</body>

</html>
